<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Character Lab</title>
    <style>
        body { 
            margin: 0; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            background: #222; 
            color: #fff; 
            font-family: sans-serif; 
        }
        #canvas-container { 
            margin-top: 20px; 
            position: relative; 
            border: 2px solid #555; 
            background: #e0e0e0; 
            width: 400px; 
            height: 500px; 
            overflow: hidden; 
        }
        .controls { 
            margin-top: 20px; 
            display: flex; 
            gap: 15px; 
            flex-wrap: wrap; 
            justify-content: center; 
            max-width: 800px; 
            background: #333;
            padding: 15px;
            border-radius: 8px;
        }
        select, button, input[type="file"], input[type="range"] { 
            padding: 5px; 
        }
        #reference-overlay { 
            position: absolute; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            object-fit: contain; 
            opacity: 0.5; 
            pointer-events: none; 
            display: none; 
            z-index: 10;
        }
        #pixi-app {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
    </style>
</head>
<body>
    <h2>Pixi.js Character Lab</h2>
    <div class="controls">
        <label>Character: <select id="char-select"></select></label>
        <label><input type="checkbox" id="spooky-toggle"> Spooky</label>
        <label><input type="checkbox" id="anim-toggle"> Animate</label>
        <label>Overlay Ref: <input type="file" id="ref-upload" accept="image/*"></label>
        <label>Ref Opacity: <input type="range" id="ref-opacity" min="0" max="1" step="0.1" value="0.5"></label>
        <button id="download-btn">Download PNG</button>
    </div>
    <div id="canvas-container">
        <img id="reference-overlay" src="" alt="Reference" />
        <div id="pixi-app"></div>
    </div>
    <script type="module" src="/src/lab.ts"></script>
</body>
</html>
