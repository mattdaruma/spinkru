<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#87ceeb">
    <meta name="description" content="Create spooky and groovy beats with Spinkru's interactive musical characters! Mix, match, and unleash your rhythm.">
    
    <!-- Open Graph & Social Meta -->
    <meta property="og:title" content="Spinkru - Make Your Own Beats">
    <meta property="og:description" content="Create spooky and groovy beats with Spinkru's interactive musical characters! Mix, match, and unleash your rhythm.">
    <meta property="og:image" content="/snippet.png">
    <meta property="og:type" content="website">
    <meta name="twitter:card" content="summary_large_image">

    <title>Spinkru</title>
    <link rel="icon" type="image/png" href="/music-favicon.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="manifest" href="/manifest.webmanifest">
    <style>
        html, body {
            width: 100%;
            height: 100%;
        }
        body { 
            margin: 0; 
            padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
            overflow: hidden; 
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            box-sizing: border-box;
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            touch-action: none; /* Prevent iOS scrolling */
        }
        canvas { 
            display: block !important; 
            max-width: 100% !important;
            max-height: 100% !important;
            width: auto !important;
            height: auto !important;
            aspect-ratio: 1920 / 1080;
        }
    </style>
</head>
<body>
    <script type="module" src="/index.ts"></script>
</body>
</html>
